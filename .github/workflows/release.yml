name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test
      - name: Check that every version matches the tag
        run: |
          v=${VERSION#v}
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json
          grep -q "/tags/v$v.tar.gz\"" packaging/claude-vimium.rb
          grep -q "^## \[$v\]" CHANGELOG.md
      - name: Publish the release
        run: |
          v=${VERSION#v}
          awk -v h="## [$v]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md >notes.md
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md
      - name: Attach the formula with the tarball's sha256
        run: |
          curl -fsSL -u "x-access-token:$GH_TOKEN" -o src.tar.gz \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$VERSION.tar.gz"
          sed "s#^  sha256 .*#  sha256 \"$(shasum -a 256 src.tar.gz | cut -d' ' -f1)\"#" \
            packaging/claude-vimium.rb >claude-vimium.rb
          gh release upload "$VERSION" claude-vimium.rb
      # Publishing to the public tap is the maintainer's call: it runs only once
      # a TAP_TOKEN secret with write access to the tap exists.
      - name: Commit the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          path=Formula/claude-vimium.rb
          sha=$(GH_TOKEN=$TAP_TOKEN gh api "repos/JeongJaeSoon/homebrew-tap/contents/$path" --jq .sha 2>/dev/null || true)
          GH_TOKEN=$TAP_TOKEN gh api -X PUT "repos/JeongJaeSoon/homebrew-tap/contents/$path" \
            -f message="claude-vimium ${VERSION#v}" \
            -f content="$(base64 <claude-vimium.rb | tr -d '\n')" \
            ${sha:+-f sha="$sha"}
