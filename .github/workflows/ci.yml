name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test
      - name: Build the universal app
        run: |
          make app VERSION=ci
          lipo -archs build/Hintvim.app/Contents/MacOS/Hintvim | grep -q 'x86_64 arm64'
          build/Hintvim.app/Contents/MacOS/Hintvim --version | grep -qx 'hintvim ci'
          codesign --verify --strict build/Hintvim.app

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning bin/hintvim test/cli.test.sh scripts/publish-tap.sh

  formula:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point the formula at this checkout in a throwaway tap
        run: |
          version=$(sed -n 's#.*/tags/v\(.*\)\.tar\.gz".*#\1#p' packaging/hintvim.rb)
          tarball="$RUNNER_TEMP/hintvim-$version.tar.gz"
          git archive --format=tar.gz --prefix="hintvim-$version/" -o "$tarball" HEAD
          brew tap-new --no-git ci/local
          tap=$(brew --repository ci/local)
          sed -e "s#^  url .*#  url \"file://$tarball\"#" \
              -e "s#^  sha256 .*#  sha256 \"$(shasum -a 256 "$tarball" | cut -d' ' -f1)\"#" \
              -e '/^  head /d' packaging/hintvim.rb >"$tap/Formula/hintvim.rb"
      - run: brew audit --strict --formula ci/local/hintvim
      - run: brew install --formula ci/local/hintvim
      - run: brew test ci/local/hintvim
      - name: Doctor on a Mac without Claude
        run: |
          hintvim doctor | tee doctor.txt || true
          grep -q 'ok    app: /' doctor.txt
      - name: The installed app carries its icon
        run: |
          app="$(brew --prefix hintvim)/Hintvim.app/Contents"
          test -s "$app/Resources/AppIcon.icns"
          test "$(plutil -extract CFBundleIconFile raw "$app/Info.plist")" = AppIcon
      - name: The formula installs shell completions
        run: |
          p=$(brew --prefix)
          test -f "$p/share/zsh/site-functions/_hintvim"
          test -f "$p/etc/bash_completion.d/hintvim"
          test -f "$p/share/fish/vendor_completions.d/hintvim.fish"
